services:
  redis:
    container_name: llmctx-redis
    image: redis:8.0.2-alpine
    ports:
      - 6379:6379
    networks:
      - llmctx
  redis-commander:
    container_name: llmctx-redis-commander
    image: rediscommander/redis-commander:latest
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - 8081:8081
    networks:
      - llmctx
  postgres:
    image: postgres:14-alpine
    container_name: llmctx-db
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - llmctx
  adminer:
    image: michalhosna/adminer
    container_name: llmctx-adminer
    depends_on:
      - postgres
    ports:
      - 8080:8080
    environment:
      ADMINER_DB: db
      ADMINER_DRIVER: pgsql
      ADMINER_PASSWORD: admin
      ADMINER_SERVER: db
      ADMINER_USERNAME: admin
      ADMINER_AUTOLOGIN: 1
      ADMINER_NAME: Adminer
    networks:
      - llmctx
volumes:
  db-data:
networks:
  llmctx:
